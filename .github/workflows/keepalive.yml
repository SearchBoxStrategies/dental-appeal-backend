# Keeps the Supabase Free-plan database from pausing, and emails the repository owner
# (GitHub's notice for a failed scheduled run) if the API or the database is down.
name: Database keep-alive

on:
  schedule:
    - cron: '17 11 * * *' # daily, 11:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API and database
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 30 \
            https://api.dentalappeal.claims/api/health/db
